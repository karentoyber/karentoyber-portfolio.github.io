<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        nav a:nth-child(3) {
            padding: 5px 10px;
            background-color: #ffd700;
            border-radius: 5px;
        }

        .text-section {
            background-color: #d3d3d3;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            line-height: 1.5;
            color: #333;
        }

        .form-section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-section label {
            font-weight: bold;
        }

        .form-section input[type="text"], .form-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #d3d3d3;
        }

        .form-section textarea {
            resize: vertical;
            height: 100px;
        }

        .form-section button {
            padding: 10px 20px;
            background-color: #ffd700;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .form-section button:hover {
            background-color: #e5c600;
        }

        @media (prefers-color-scheme: dark) {
            nav a:nth-child(3) {
                background-color: #ffd700;
                color: #1e1e1e;
            }

            .text-section {
                background-color: #333333;
                color: #ffffff;
            }

            .form-section {
                background-color: #1e1e1e;
            }

            .form-section input[type="text"], .form-section textarea {
                background-color: #333333;
                color: #ffffff;
                border: 1px solid #555555;
            }

            .form-section button {
                background-color: #ffd700;
                color: #1e1e1e;
            }

            .form-section button:hover {
                background-color: #e5c600;
            }
        }

        @media (max-width: 768px) {
            .text-section, .form-section {
                font-size: 16px;
                padding: 15px;
            }

            .form-section textarea {
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html">
        <img class="logo" src="images/logo-medium.png" alt="Logo" srcset="images/logo-small.png 50w, images/logo-medium.png 80w, images/logo-large.png 110w"></a>
        <nav>
            <a href="about.html">About Me</a>
            <a href="portfolio.html">My Portfolio</a>
            <a href="contact.html">Contact Me</a>
        </nav>
    </header>

    <div class="grid-container-4">
        <div class="text-section">
            <h1>Reach Out!</h1>
            <p>If you have any questions or comments, feel free to reach out to me! Use the form on the right to send me a message, and I'll get back to you as soon as possible.</p>
        </div>
        <div class="form-section">
            <form action="https://formspree.io/f/mdkovnge" method="post">
            <label for="email">Your Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email">

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" placeholder="Write your message here..."></textarea>
            <button type="submit">Send</button>
        </form>
        </div>
    </div>

    <footer>
        <a href="mailto:kt2838@stern.nyu.edu">
            <span>kt2838@stern.nyu.edu</span>
        </a>
        <div class="buttons">
            <a href="https://www.linkedin.com/in/karen-toyber-a5b867203/"><button>LinkedIn</button></a>
            <a href="https://docs.google.com/document/d/1L35cW7mJLMFsN_S55VV8U26ynwWeow1XaWBriKEuBOQ/edit?usp=sharing"><button>Resume</button></a>
        </div>
    </footer>
</body>
</html>
